name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  release:
    needs: security
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Create and push tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -- "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMETAP_TOKEN: ${{ secrets.HOMETAP_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download --repo softleader/homebrew-tap --pattern "brew-tapper-linux-amd64.tar.gz" --output tapper.tar.gz
          tar -xvf tapper.tar.gz
          chmod +x tapper
          ./tapper --owner softleader \
            --token "$HOMETAP_TOKEN" \
            --formula slctl \
            --version "$RELEASE_TAG" \
            --dist ./dist
